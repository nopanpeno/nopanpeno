<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="60%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fef9c3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="round"><rect width="1000" height="240" rx="18"/></clipPath>
  </defs>
  <style>
    .t { animation-name: tw; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    @keyframes tw { 0%,100% { opacity:.15 } 50% { opacity:1 } }
    .sp { animation: sparkle 3.5s ease-in-out infinite; }
    @keyframes sparkle { 0%,100% { transform: scale(.3) rotate(0deg); opacity:.2 } 50% { transform: scale(1.2) rotate(45deg); opacity:1 } }
    .shoot { animation: shoot 7s linear infinite; }
    .shoot2 { animation: shoot 9s linear infinite; animation-delay:-4s; }
    @keyframes shoot {
      0% { transform: translate(-200px,-40px); opacity:0 }
      4% { opacity:1 }
      14% { transform: translate(520px,160px); opacity:0 }
      100% { transform: translate(520px,160px); opacity:0 }
    }
    .m { font-family:'Fira Code','SFMono-Regular',Consolas,'Courier New',monospace; font-weight:600 }
    .title { font-family:'Fira Code','SFMono-Regular',Consolas,'Courier New',monospace; font-weight:700; animation: glow 4s ease-in-out infinite; }
    @keyframes glow { 0%,100% { filter: drop-shadow(0 0 4px #36bcf7) } 50% { filter: drop-shadow(0 0 14px #36bcf7) } }
    .moon { animation: pulse 6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:.6 } 50% { opacity:1 } }
  </style>
